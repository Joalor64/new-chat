<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Joalor64's Chatroom</title>
    <meta name='author' content='Joalor64'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="icon" href="favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div>
                    <span class="eyebrow">Community</span>
                    <h2>Rooms</h2>
                </div>
                <i id="settings-icon" class="fa fa-gear" aria-label="Open settings"></i>
            </div>

            <div id="room-list" class="room-list" aria-live="polite"></div>

            <div class="room-creator">
                <input id="room-name" type="text" maxlength="24" placeholder="New room name" />
                <button id="create-room" class="button" type="button">Add</button>
            </div>
        </aside>

        <main class="chat-panel">
            <header class="chat-header">
                <div>
                    <span class="eyebrow">Active room</span>
                    <h1 id="room-header">#general</h1>
                </div>
                <button id="theme" class="ghost-button" type="button">Toggle theme</button>
            </header>

            <div class="messageArea" id="messageArea"></div>
            <button id="scroll-to-latest" class="scroll-to-latest hidden" type="button">Jump to latest</button>
            <div id="typing-status" class="typing-status" aria-live="polite">No one is typing.</div>

            <form class="form" id="form">
                <input class="input" type="text" placeholder="Name" id="myname" />
                <input class="input" type="text" placeholder="Message" id="message" />
                <button class="button" type="submit">Send Message</button>
            </form>
        </main>
    </div>

    <div id="settings-popup" class="popup hidden">
        <div class="popup-header">
            <span>Settings</span>
            <button id="close-popup" class="close-button" type="button">&times;</button>
        </div>
        <div class="popup-content">
            <label for="username-color">Username Color:</label>
            <input type="color" id="username-color" />

            <label for="profile-picture">Profile Picture:</label>
            <input type="file" id="profile-picture" accept="image/*" />

            <button id="save-settings" class="button" type="button">Save</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/emoji-js@3.6.0/lib/emoji.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
